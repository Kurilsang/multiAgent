<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multiagent 对话</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1d2230;
    --border: #2a3040;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent-2: #2f6fe0;
    --user-bubble: #2b5fd9;
    --assistant-bubble: #1d2230;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  select, button, input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  input { cursor: text; }
  select:hover, button:hover { border-color: var(--accent); }
  #clear-btn:hover { border-color: var(--error); color: var(--error); }
  #market-btn { border-color: var(--accent-2); color: var(--accent); }
  /* 会话侧栏（#57）：会话列表 + 任务状态指示 */
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 240px; flex: none; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar.hidden { display: none; }
  #sidebar-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  #sidebar-head span { font-size: 13px; color: var(--muted); flex: 1; }
  #sidebar-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .sess-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  .sess-item:hover { background: var(--panel-2); }
  .sess-item.active { background: var(--panel-2); border-color: var(--accent); }
  .sess-item .sess-name {
    flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sess-item .sess-name.empty { color: var(--muted); font-style: italic; }
  .sess-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .sess-dot.running { background: #4ade80; }
  .sess-dot.interrupted { background: #fbbf24; }
  .sess-item .sess-act {
    opacity: 0; padding: 2px 6px; font-size: 11px; border-radius: 6px;
  }
  .sess-item:hover .sess-act { opacity: 1; }
  #sidebar-toggle { padding: 6px 10px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); }
  .msg.error .bubble { background: transparent; border: 1px solid var(--error); color: var(--error); border-radius: 12px; }
  .bubble.thought {
    background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-size: 12.5px; width: 100%;
  }
  .bubble.thought::before {
    content: "思考"; display: block; font-size: 11px;
    opacity: 0.75; margin-bottom: 2px;
  }
  .bubble.act {
    background: transparent; border: 1px dashed var(--accent-2); color: var(--accent);
    font-family: Consolas, "Courier New", monospace; font-size: 12.5px; width: 100%;
  }
  .bubble.obs {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); font-size: 12.5px; width: 100%;
  }
  .bubble.obs.error { color: var(--error); border-color: var(--error); }
  #toast {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; }
  .typing { display: inline-flex; gap: 4px; padding: 12px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #input {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: inherit;
    height: 46px; max-height: 140px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent-2); border: none; color: #fff;
    padding: 0 22px; border-radius: 10px; font-size: 14px;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #send-btn:hover:not(:disabled) { background: var(--accent); }
  #task-btn {
    background: transparent; border: 1px solid var(--accent-2); color: var(--accent);
    padding: 0 16px; border-radius: 10px; font-size: 13px;
  }
  #task-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #task-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }

  /* ===== Agent 任务时间线 ===== */
  .task-card {
    align-self: flex-start; max-width: 86%;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .task-title { font-size: 12px; color: var(--muted); }
  .task-card .step { font-size: 13px; line-height: 1.6; }
  .step.thought { color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .step.action { color: var(--accent); font-family: Consolas, "Courier New", monospace; font-size: 12.5px; }
  .step.observation {
    color: var(--text); background: var(--panel-2); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .step.observation.error { color: var(--error); }
  .step.final, .step.failed {
    white-space: pre-wrap; word-break: break-word; font-weight: 600;
    border-top: 1px solid var(--border); padding-top: 8px;
  }
  .step.failed { color: var(--error); }
  .step.rework { color: var(--accent); border-top: 1px solid var(--border); padding-top: 8px; }

  /* ===== 多 Agent 轨迹树：子 agent / 审查分区（深度限一层） ===== */
  .agent-block {
    border-left: 2px solid var(--accent-2); margin-left: 6px; padding-left: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .agent-head { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stop-btn {
    background: transparent; border: 1px solid var(--error); color: var(--error);
    padding: 0 12px; border-radius: 10px; font-size: 13px;
  }
  #stop-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #stop-btn:hover:not(:disabled) { background: var(--panel-2); }

  /* ===== /技能名 弹层 ===== */
  #slash-pop {
    position: fixed; left: 20px; bottom: 74px; width: 360px; max-height: 280px;
    overflow-y: auto; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; z-index: 20; display: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .slash-item {
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline;
  }
  .slash-item.active, .slash-item:hover { background: var(--accent-2); }
  .slash-name { font-weight: 600; white-space: nowrap; }
  .slash-desc { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slash-item.active .slash-desc, .slash-item:hover .slash-desc { color: var(--text); }
  .slash-hint { padding: 6px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }

  /* ===== 技能市场 ===== */
  #skills-view {
    flex: 1; overflow-y: auto; padding: 20px; display: none;
    flex-direction: column; gap: 16px;
  }
  .panel-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .panel-box h2 { font-size: 14px; margin: 0; font-weight: 600; }
  #installed-panel { display: flex; flex-direction: column; gap: 16px; }
  .install-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .install-row input {
    flex: 1; min-width: 180px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  .install-row input:focus { border-color: var(--accent); }
  #install-report { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  .skill-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .skill-card.off { opacity: 0.6; }
  .skill-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .skill-name { font-weight: 600; font-size: 14px; }
  .skill-desc { color: var(--muted); font-size: 12.5px; }
  .badge {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 6px;
  }
  .skill-actions { display: flex; gap: 8px; }
  .skill-actions button { font-size: 12px; padding: 4px 10px; }
  .skill-actions .danger:hover { border-color: var(--error); color: var(--error); }
  .skill-card pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 12px; margin: 0; max-height: 320px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .load-errors { color: var(--error); font-size: 12.5px; white-space: pre-wrap; }

  /* ===== 市场子面板与确认卡 ===== */
  .sub-tabs { display: flex; gap: 8px; }
  .sub-tab { padding: 6px 16px; }
  .sub-tab.active { border-color: var(--accent); color: var(--accent); }
  .badge.pass { color: #3ecf6f; border-color: #3ecf6f; }
  .badge.warn { color: #e8b339; border-color: #e8b339; }
  .badge.fail { color: var(--error); border-color: var(--error); }
  .badge.kind { color: var(--accent); border-color: var(--accent-2); }
  .market-row.off { opacity: 0.6; }
  .market-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 4px; border-bottom: 1px solid var(--border);
  }
  .market-row:last-child { border-bottom: none; }
  .market-warn {
    color: #e8b339; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .market-warn:empty { display: none; }
  .market-row .skill-name { flex: 0 0 auto; }
  .market-row .skill-desc { flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #confirm-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 30;
  }
  #confirm-mask[hidden] { display: none; }
  .confirm-card {
    width: min(560px, 92vw); max-height: 84vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .confirm-card h2 { font-size: 16px; margin: 0; }
  .confirm-card pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 12px; margin: 0; max-height: 320px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .confirm-card pre[hidden] { display: none; }
  #cf-caps:empty, #cf-form:empty, .cf-risk:empty { display: none; }
  .cap-line { font-size: 12.5px; word-break: break-all; }
  .cap-line.cmd {
    font-family: Consolas, "Courier New", monospace;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px;
  }
  .cf-risk {
    color: #e8b339; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
    border: 1px solid #e8b339; border-radius: 8px; padding: 6px 10px;
  }
  #cf-form { display: flex; flex-direction: column; gap: 8px; }
  .cf-field { display: flex; flex-direction: column; gap: 4px; }
  .cf-field label { font-size: 12px; color: var(--muted); }
  .cf-field input, .cf-field select { width: 100%; padding: 6px 10px; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" title="显示/隐藏会话列表">☰</button>
    <h1>multiagent</h1>
    <span class="meta" id="default-hint"></span>
    <div class="spacer"></div>
    <select id="provider-select" title="选择厂商">
      <option value="">默认厂商</option>
    </select>
    <button id="market-btn" title="查看与安装技能、MCP 服务">市场</button>
    <button id="export-btn" title="导出对话记录为 Markdown（含任务轨迹与错误，可直接粘贴给 AI）">导出</button>
    <button id="clear-btn" title="新建一段对话（旧会话保留在左侧列表中）">新建</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-head">
        <span>会话</span>
        <button id="new-session-btn" title="新建会话">＋</button>
      </div>
      <div id="sidebar-list"></div>
    </aside>
    <div id="chat"></div>
  </div>

  <div id="skills-view">
    <div class="sub-tabs">
      <button id="kind-skill" class="sub-tab active">技能</button>
      <button id="kind-mcp" class="sub-tab">MCP 服务</button>
      <span style="flex:1"></span>
      <button id="tab-installed" class="sub-tab active">已安装</button>
      <button id="tab-online" class="sub-tab">在线浏览</button>
    </div>
    <div id="installed-panel">
      <div class="panel-box" id="skill-install-box">
        <h2>安装技能（手动）</h2>
        <div class="install-row">
          <select id="preset-select" title="预设平台源"><option value="">预设平台源…</option></select>
          <input id="install-url" placeholder="Git 仓库地址（支持 anthropics/skills、skills.sh 等 SKILL.md 生态）">
          <input id="install-sub" placeholder="子目录（可选）" style="max-width: 150px;">
        </div>
        <div class="install-row">
          <input id="install-path" placeholder="本地目录（服务器侧路径）">
          <button id="install-git-btn">从 Git 安装</button>
          <button id="install-local-btn">本地导入</button>
        </div>
      </div>
      <div class="panel-box" id="mcp-install-box" style="display:none">
        <h2>接入 MCP 服务（手动）</h2>
        <div class="install-row">
          <input id="mcp-import-path" placeholder="本地 server.json / mcp.json（服务器侧路径）">
          <button id="mcp-import-btn">本地导入</button>
          <button id="mcp-reload-btn" title="重读连接定义并整体重连（手改 mcp/servers.json 后生效）">重载</button>
        </div>
        <div class="skill-desc">连接定义可手写直改：密钥只以 ${VAR} 占位写入 .env；改完点「重载」生效。</div>
      </div>
      <div class="panel-box">
        <h2 id="installed-title">已安装技能</h2>
        <div id="install-report"></div>
        <div class="load-errors" id="load-errors"></div>
        <div id="installed-list"></div>
      </div>
    </div>
    <div id="online-panel" style="display:none">
      <div class="panel-box">
        <h2>在线目录 <span class="meta" id="market-freshness"></span></h2>
        <div class="install-row">
          <input id="market-q" placeholder="搜索名称 / 描述…">
          <select id="market-source"><option value="">全部来源</option></select>
          <button id="market-search-btn">搜索</button>
          <button id="market-refresh-btn" title="立即爬取一次目录（翻到见底，后台爬取，可继续浏览）">刷新目录</button>
        </div>
        <div class="market-warn" id="market-warnings"></div>
        <div id="market-list"></div>
        <div class="skill-actions">
          <button id="market-prev">上一页</button>
          <span class="meta" id="market-pageinfo"></span>
          <button id="market-next">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <div id="confirm-mask" hidden>
    <div class="confirm-card">
      <h2 id="cf-name"></h2>
      <div class="skill-head" id="cf-badges"></div>
      <div class="skill-desc" id="cf-desc"></div>
      <div class="badge" id="cf-origin"></div>
      <div id="cf-caps"></div>
      <div class="cf-risk" id="cf-risk"></div>
      <div id="cf-form"></div>
      <div class="skill-actions">
        <button id="cf-preview-btn">查看 SKILL.md</button>
      </div>
      <pre id="cf-preview" hidden></pre>
      <div class="skill-actions" style="justify-content: flex-end;">
        <button id="cf-cancel">取消</button>
        <button id="cf-install">确认安装</button>
      </div>
    </div>
  </div>

  <footer>
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行；输入 / 弹出技能列表，Tab 选中" autofocus></textarea>
    <button id="task-btn" title="作为自主多步任务执行（思考→行动→观察）">任务</button>
    <button id="stop-btn" title="叫停当前任务（含在跑子 agent）">停止</button>
    <button id="send-btn">发送</button>
  </footer>

  <div id="slash-pop"></div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const taskBtn = document.getElementById('task-btn');
const stopBtn = document.getElementById('stop-btn');
const clearBtn = document.getElementById('clear-btn');
const exportBtn = document.getElementById('export-btn');
const marketBtn = document.getElementById('market-btn');
const providerEl = document.getElementById('provider-select');
const defaultHintEl = document.getElementById('default-hint');
const skillsViewEl = document.getElementById('skills-view');
const slashPopEl = document.getElementById('slash-pop');
let busy = false;
let toastTimer = null;

// ===== 会话（SPEC-0005）：历史权威副本在服务端，页面按 URL 恢复 =====
// URL 带 ?session=<id> 就进入该会话；不带则空页面，用户首条消息时即时建会话。
let sessionId = new URLSearchParams(location.search).get('session') || '';

function setSessionId(id) {
  sessionId = id || '';
  const url = sessionId ? location.pathname + '?session=' + encodeURIComponent(sessionId)
    : location.pathname;
  history.replaceState(null, '', url);
}

function withSession(body) {
  if (sessionId) body.session_id = sessionId;
  return body;
}

// 页面加载时把服务端历史重放进 DOM（不引入前端数据模型，导出按钮照旧遍历 DOM）
async function restoreSession() {
  if (!sessionId) {
    addMessage('assistant', '你好！我是 multiagent。发送第一条消息即创建会话；输入 / 可快速点名技能。');
    renderSessionList();
    return;
  }
  let payload = null;
  try {
    const res = await fetch('/sessions/' + encodeURIComponent(sessionId) + '/messages');
    if (res.ok) payload = await res.json();
  } catch (e) { /* 服务不可用时静默，页面保持空 */ }
  if (!payload) {
    addMessage('error', '会话加载失败：' + sessionId);
    return;
  }
  chatEl.innerHTML = '';
  for (const message of payload.messages || []) {
    replayMessage(message);
  }
  if (!(payload.messages || []).length) {
    addMessage('assistant', '（空会话）发送第一条消息开始。');
  }
  // 刷新后回放任务轨迹（#58），再把在跑的任务接回实时流（断连续流，T5）
  await restoreTaskTimelines();
  resumeRunningTask();
  renderSessionList();
}

function replayMessage(message) {
  if (message.role === 'user') {
    addMessage('user', message.content);
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant' + (message.status === 'failed' ? ' error' : '');
  if (message.reasoning) {
    const thought = document.createElement('div');
    thought.className = 'bubble thought';
    thought.textContent = message.reasoning;
    wrap.appendChild(thought);
  }
  for (const step of message.steps || []) {
    const el = document.createElement('div');
    if (step.type === 'action') {
      el.className = 'bubble act';
      el.textContent = '→ ' + step.tool + '(' + JSON.stringify(step.arguments) + ')';
    } else {
      el.className = 'bubble obs' + (step.is_error ? ' error' : '');
      el.textContent = step.text;
    }
    wrap.appendChild(el);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = message.content;
  wrap.appendChild(bubble);
  if (message.provider) addMeta(wrap, message.provider + ' / ' + message.model);
  chatEl.appendChild(wrap);
  scrollToBottom();
}

function sessionItem(entry) {

    : entry.interrupted ? 'interrupted' : '';

    : state === 'interrupted' ? '有任务被中断（进程重启）' : '空闲';
  item.appendChild(dot);

  name.className = 'sess-name' + (entry.name ? '' : ' empty');

  const rename = document.createElement('button');
  rename.className = 'sess-act';
  rename.textContent = '改名';
  rename.addEventListener('click', (e) => {

    renameSession(entry);

async function renameSession(entry) {
  const name = prompt('会话名称', entry.name || '');
  if (name === null || !name.trim()) return;
  try {
    const res = await fetch('/sessions/' + encodeURIComponent(entry.id) + '/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await renderSessionList();
  } catch (e) {
    toast('重命名失败：' + e.message);

async function deleteSession(entry) {

  try {
    const res = await fetch('/sessions/' + encodeURIComponent(entry.id), { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (entry.id === sessionId) {
      setSessionId('');
      chatEl.innerHTML = '';
      restoreSession();
    }
    await renderSessionList();
  } catch (e) {
    toast('删除失败：' + e.message);

}

async function newSession() {
  if (busy) { toast('当前有任务在跑，等它结束再新建会话'); return; }
  try {
    const res = await fetch('/reset', { method: 'POST' });
    const data = await res.json();
    setSessionId(data.session_id || '');

    toast('新建会话失败：' + e.message);

// ===== 任务轨迹回放（#58）：刷新后按会话读回轨迹 =====
async function restoreTaskTimelines() {
  if (!sessionId) return;
  let payload;
  try {
    const res = await fetch('/sessions/' + encodeURIComponent(sessionId) + '/tasks');
    if (!res.ok) return;
    payload = await res.json();
  } catch (e) {
    return;  // 轨迹回放失败不影响主对话
  }
  for (const entry of payload.tasks || []) {
    if (entry.live) continue;  // 在跑的任务由 resumeRunningTask 接回实时流
    replayTask(entry);
  }
}

function replayTask(entry) {
  const timeline = makeTaskTimeline('任务 > ' + entry.task);
  // frames 由服务端用同一套编码器产出（含 agent 身份字段与中断标注），直接重放
  for (const frame of entry.frames || []) {
    timeline.handle(frame);
  }
  if (entry.interrupted) {
    // 中断标注已由服务端给出（文案与状态判定都只有一处实现），这里只加「重跑」
    const rerun = document.createElement('button');
    rerun.textContent = '重跑';
    rerun.title = '以同一任务文本发起一次全新任务（不是续跑）';
    rerun.addEventListener('click', () => {
      inputEl.value = entry.task;
      toast('已填入任务文本：这是一次新任务，不会接续上次的进度');
      runAgent();
    });
    timeline.card.appendChild(rerun);
  }
  return timeline;
}

function toast(text) {

  el.textContent = text;
  el.classList.add('show');

  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);

function addMessage(role, text, meta) {

// 上下文账目角标（SPEC-0006）：估算占用 / 预算，降级时标注
function formatContextBadge(meta) {
  if (!meta || !meta.budget_tokens) return '';
  const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
  let text = '≈' + fmt(meta.estimated_tokens) + ' / ' + fmt(meta.budget_tokens) + ' token';
  if (meta.degraded) text += '（已降级）';
  return text;
}

// 解析 SSE 字节流为事件对象（data: {...}\n\n）
async function* readSse(stream) {
  const reader = stream.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const frame = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      for (const line of frame.split('\n')) {
        if (line.startsWith('data: ')) yield JSON.parse(line.slice(6));
      }
    }
  }
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';

  return wrap;

// 任务时间线卡片：/agent/stream 与 /技能名 路由共用
function makeTaskCard(title) {
  const card = document.createElement('div');
  card.className = 'task-card';
  const titleEl = document.createElement('div');
  titleEl.className = 'task-title';
  titleEl.textContent = title;
  card.appendChild(titleEl);
  chatEl.appendChild(card);
  scrollToBottom();
  const addStep = (className, textContent) => {
    const step = document.createElement('div');
    step.className = 'step ' + className;
    if (textContent !== undefined) step.textContent = textContent;
    card.appendChild(step);
    scrollToBottom();
    return step;
  };
  return { card, addStep };
}

// 多 Agent 轨迹树映射器：/agent/stream 与 /技能名 路由共用。
// agent_id 分区（子 agent / 审查各自一块，深度限一层），根 agent 的
// task_started 若非首次出现 = 回炉重跑（critic 判 revise 后整体重跑）。
function makeTaskTimeline(title) {
  const { card, addStep } = makeTaskCard(title);
  const blocks = new Map();
  const thoughts = new Map();
  const roleLabel = (role) =>
    role === 'critic' ? '审查 agent' : role === 'worker' ? '子 agent' : '编排器';
  const blockFor = (key) => {
    let block = blocks.get(key);
    if (!block) {
      const box = document.createElement('div');
      box.className = 'agent-block';
      const head = document.createElement('div');
      head.className = 'agent-head';
      box.appendChild(head);
      card.appendChild(box);
      const addBlockStep = (className, textContent) => {
        const step = document.createElement('div');
        step.className = 'step ' + className;
        if (textContent !== undefined) step.textContent = textContent;
        box.appendChild(step);
        scrollToBottom();
        return step;
      };
      block = { head, addStep: addBlockStep };
      blocks.set(key, block);
    }
    return block;
  };
  const handle = (evt) => {
    const key = evt.agent_id || 'main';
    const root = key === 'main';
    if (evt.type === 'task_started') {
      if (!root) {
        const block = blockFor(key);
        block.head.textContent =
          '[' + roleLabel(evt.role) + '] ' + (evt.agent_name || key) + ' > ' + evt.task;
      } else if (card.childElementCount > 1) {
        addStep('rework', '↺ 回炉重跑（审查意见并入任务）');
      }
      return;
    }
    const target = root ? { addStep } : blockFor(key);
    const closeThought = () => thoughts.delete(key);
    if (evt.type === 'thought_delta') {
      let thoughtEl = thoughts.get(key);
      if (!thoughtEl) {
        thoughtEl = target.addStep('thought', '');
        thoughts.set(key, thoughtEl);
      }
      thoughtEl.textContent += evt.text;
    } else if (evt.type === 'action') {
      closeThought();
      target.addStep('action', '→ ' + evt.tool + '(' + JSON.stringify(evt.arguments) + ')');
    } else if (evt.type === 'observation') {
      target.addStep('observation' + (evt.is_error ? ' error' : ''), evt.text);
    } else if (evt.type === 'final') {
      closeThought();
      target.addStep(
        'final',
        evt.answer +
          (evt.status === 'partial'
            ? '\n（部分完成——预算耗尽/被叫停/有子任务未达成，以上为已有进展）'
            : '')
      );
      if (root) addMeta(card, evt.iterations + ' 轮');
    } else if (evt.type === 'failed') {
      closeThought();
      target.addStep('failed', '任务失败：' + evt.reason + '（第 ' + evt.iterations + ' 轮）');
    }
    scrollToBottom();
  };
  return { card, addStep, handle };
}

    const res = await fetch('/skills');

  } catch (e) {

// ===== /技能名 弹层：搜索 + ↑↓ + Tab/Enter 选中插入 =====
let slashHits = [];
let slashIndex = 0;

function slashQuery() {
  const value = inputEl.value;
  if (!value.startsWith('/') || /\s/.test(value)) return null;
  return value.slice(1);
}

async function updateSlashPop() {
  const query = slashQuery();
  if (query === null) { hideSlashPop(); return; }
  const data = await fetchSkills();
  const q = query.toLowerCase();
  slashHits = data.skills
    .filter((s) => s.enabled)
    .filter((s) => s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q))
    .slice(0, 8);
  if (!slashHits.length) { hideSlashPop(); return; }
  slashIndex = Math.min(slashIndex, slashHits.length - 1);
  slashPopEl.innerHTML = '';
  slashHits.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'slash-item' + (i === slashIndex ? ' active' : '');
    const name = document.createElement('span');
    name.className = 'slash-name';
    name.textContent = '/' + s.name;
    const desc = document.createElement('span');
    desc.className = 'slash-desc';
    desc.textContent = s.description;
    item.appendChild(name);
    item.appendChild(desc);
    item.addEventListener('mousedown', (e) => { e.preventDefault(); pickSlash(s.name); });
    slashPopEl.appendChild(item);
  });
  const hint = document.createElement('div');
  hint.className = 'slash-hint';
  hint.textContent = '↑↓ 选择 · Tab/Enter 插入技能名 · Esc 关闭';
  slashPopEl.appendChild(hint);
  slashPopEl.style.display = 'block';
}

function hideSlashPop() {
  slashPopEl.style.display = 'none';
  slashHits = [];
  slashIndex = 0;
}

function pickSlash(name) {
  inputEl.value = '/' + name + ' ';
  hideSlashPop();
  inputEl.focus();
}

function slashOpen() {
  return slashPopEl.style.display === 'block' && slashHits.length > 0;
}

// ===== 发送：普通聊天（迷你技能循环）或 /技能名 路由的任务流 =====
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  hideSlashPop();
  // 空页面（无 ?session=）时首条消息即时建会话并改写 URL（SPEC-0005 Q6）
  // 会话名由服务端按首条消息生成（命名规则只在 app/sessions.py 一处）
  if (!sessionId) {
    try {
      const res = await fetch('/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      if (data.session_id) setSessionId(data.session_id);
      chatEl.innerHTML = '';
    } catch (e) { /* 建会话失败则退回默认会话（服务端兜底） */ }
  }
  busy = true;
  sendBtn.disabled = true;
  taskBtn.disabled = true;
  stopBtn.disabled = false;
  inputEl.value = '';
  inputEl.style.height = '46px';
  addMessage('user', text);

  const typing = addTyping();
  const body = withSession({ message: text });
  if (providerEl.value) body.provider = providerEl.value;
  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    typing.remove();
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      const detail = typeof (err && err.detail) === 'string'
        ? err.detail : (err && err.detail ? JSON.stringify(err.detail) : 'HTTP ' + res.status);
      addMessage('error', '出错了：' + detail);
      return;
    }
    let wrap = null, bubble = null, thoughtEl = null;
    let task = null;
    const ensureWrap = () => {
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.className = 'msg assistant';
        chatEl.appendChild(wrap);
      }
      return wrap;
    };
    const ensureBubble = () => {
      if (!bubble) {
        bubble = document.createElement('div');
        bubble.className = 'bubble';
        ensureWrap().appendChild(bubble);
      }
      scrollToBottom();
      return bubble;
    };
    for await (const evt of readSse(res.body)) {
      if (evt.type === 'task_meta') {
        // /技能名 前缀路由：服务端升级为任务通道，按时间线渲染（多 Agent 树）
        task = makeTaskTimeline('技能任务 > ' + text);
        runningTask = { taskId: evt.task_id, lastSeq: 0, timeline: task };
        handleTaskFrame(evt);
        continue;
      }
      if (task) {
        handleTaskFrame(evt);
        continue;
      }
      if (evt.type === 'reasoning_delta') {
        if (!thoughtEl) {
          thoughtEl = document.createElement('div');
          thoughtEl.className = 'bubble thought';
          ensureWrap().appendChild(thoughtEl);
        }
        thoughtEl.textContent += evt.text;
      } else if (evt.type === 'delta') {
        ensureBubble().textContent += evt.text;
      } else if (evt.type === 'action') {
        // 技能步骤：动作另起气泡，随后的增量（回答）与上文分开
        bubble = null;
        const step = document.createElement('div');
        step.className = 'bubble act';
        step.textContent = '→ ' + evt.tool + '(' + JSON.stringify(evt.arguments) + ')';
        ensureWrap().appendChild(step);
      } else if (evt.type === 'observation') {
        bubble = null;
        const step = document.createElement('div');
        step.className = 'bubble obs' + (evt.is_error ? ' error' : '');
        step.textContent = evt.text;
        ensureWrap().appendChild(step);
      } else if (evt.type === 'done') {
        const badge = formatContextBadge(evt.context_meta);
        addMeta(ensureWrap(), evt.provider + ' / ' + evt.model + (badge ? ' · ' + badge : ''));
      } else if (evt.type === 'error') {
        ensureWrap().classList.add('error');
        ensureBubble().textContent = '出错了：' + evt.detail;
      }
      scrollToBottom();
    }
    if (!task && bubble && !bubble.textContent) bubble.textContent = '（空回复）';
    scrollToBottom();
    // 技能任务中途断连时从缺口接回（首条流已消费完，直接按缺口重连）
    if (task && runningTask && runningTask.needsReconnect) {
      await drainTaskStream(
        {
          url: '/agent/tasks/' + encodeURIComponent(runningTask.taskId)
            + '/stream?from_seq=' + runningTask.lastSeq,
        },
        task,
      );
    }
  } catch (e) {
    typing.remove();
    addMessage('error', '网络错误：' + e.message);
  } finally {
    // 清掉任务态：否则 /技能名 任务结束后残留的 runningTask 会让停止按钮
    // 指向已结束的 task_id，且下一个任务的 seq 从 1 重来时被去重逻辑全丢
    runningTask = null;
    busy = false;
    sendBtn.disabled = false;
    taskBtn.disabled = false;
    stopBtn.disabled = true;
    inputEl.focus();
  }
}

// ===== 任务流：新任务与重连续流共用一条读取回路（SPEC-0005 T1/T5） =====
// 断连 = 退订，服务端任务照跑；重连时带上 task_id 与已收最大 seq，缺口由服务端补发。
let runningTask = null;   // { taskId, lastSeq, timeline }

function handleTaskFrame(evt) {
  if (evt.type === 'task_meta') {
    if (runningTask) runningTask.taskId = evt.task_id;
    return;
  }
  if (evt.type === 'truncated') {
    // 服务端明确告知事件被截断：标记后由 consumeTaskStream 从缺口重连
    if (runningTask) {
      runningTask.lastSeq = evt.from_seq || runningTask.lastSeq;
      runningTask.needsReconnect = true;
    }
    return;
  }
  if (typeof evt.seq === 'number') {
    if (runningTask) {
      if (evt.seq <= runningTask.lastSeq) return;  // 补发段与实时段的重叠去重
      runningTask.lastSeq = evt.seq;
    }
  }
  if (runningTask) runningTask.timeline.handle(evt);
}

async function consumeTaskStream(res, timeline) {
  for await (const evt of readSse(res.body)) {
    handleTaskFrame(evt);
  }
}

// 读一条任务流；网络中断或服务端报告截断时，从缺口处重连续上（最多几次，防死循环）。
// first = { url, options } 描述首条流（发起任务用 POST，重连用 GET）。
// 返回 true = 流正常结束；false = 中途断开且已放弃重连。
async function drainTaskStream(first, timeline) {
  let pending = first;
  for (let attempt = 0; attempt <= 5; attempt++) {
    if (!pending) return true;
    let dropped = false;
    try {
      const res = await fetch(pending.url, pending.options);
      if (!res.ok || !res.body) {
        const err = await res.json().catch(() => null);
        const detail = typeof (err && err.detail) === 'string'
          ? err.detail : 'HTTP ' + res.status;
        timeline.addStep('failed', '出错了：' + detail);
        return false;
      }
      await consumeTaskStream(res, timeline);
    } catch (e) {
      // 网络中断 / 流中途断开：任务仍在服务端跑，退避后从缺口接回（#59）
      dropped = true;
    }
    const needsRetry = dropped || (runningTask && runningTask.needsReconnect);
    if (!needsRetry) return true;
    if (!runningTask || !runningTask.taskId) {
      // 还不知道任务标识（首帧都没收到），无法定位任务
      timeline.addStep('failed', '连接中断，且未取得任务标识：请刷新页面查看任务状态');
      return false;
    }
    if (attempt === 5) {
      timeline.addStep('failed', '多次重连未成功，已放弃自动重连；请刷新页面重试');
      return false;
    }
    timeline.addStep('rework', '（连接中断，正在重连…）');
    runningTask.needsReconnect = false;
    await new Promise((resolve) => setTimeout(resolve, 300 * (attempt + 1)));
    pending = {
      url: '/agent/tasks/' + encodeURIComponent(runningTask.taskId)
        + '/stream?from_seq=' + runningTask.lastSeq,
    };
  }
  return false;
}

// 页面加载时若本会话有任务在跑，接回实时流（否则刷新即与任务失联）
async function resumeRunningTask() {
  if (!sessionId) return;
  let taskId = null;
  try {
    const res = await fetch('/sessions');
    const data = await res.json();
    const entry = (data.sessions || []).find((s) => s.id === sessionId);
    taskId = entry && entry.running_task_id;
  } catch (e) { /* 服务不可用则跳过 */ }
  if (!taskId) return;
  const timeline = makeTaskTimeline('任务（重连中…）');
  runningTask = { taskId, lastSeq: 0, timeline };
  toast('正在接回在跑的任务…');
  try {
    await drainTaskStream(
      {
        url: '/agent/tasks/' + encodeURIComponent(taskId) + '/stream?from_seq=0',
      },
      timeline,
    );
  } catch (e) {
    timeline.addStep('failed', '重连失败：' + e.message);
  } finally {
    runningTask = null;
    renderSessionList();  // 任务结束后刷新侧栏状态点
  }
}

async function runAgent() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  hideSlashPop();
  if (!sessionId) {
    try {
      const res = await fetch('/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      if (data.session_id) setSessionId(data.session_id);
      chatEl.innerHTML = '';
    } catch (e) { /* 退回默认会话 */ }
  }
  busy = true;
  sendBtn.disabled = true;
  taskBtn.disabled = true;
  stopBtn.disabled = false;
  inputEl.value = '';
  inputEl.style.height = '46px';

  const body = withSession({ task: text });
  if (providerEl.value) body.provider = providerEl.value;

  const timeline = makeTaskTimeline('任务 > ' + text);
  runningTask = { taskId: null, lastSeq: 0, timeline };

  try {
    const ok = await drainTaskStream(
      {
        url: '/agent/stream',
        options: {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        },
      },
      timeline,
    );
    if (!ok) {
      // 未能接回：任务仍在服务端跑，如实说明可刷新接回（不谎报任务失败）
      timeline.addStep('failed', '连接已断开（任务仍在服务端运行，刷新页面可接回）');
    }
  } catch (e) {
    timeline.addStep('failed', '网络错误：' + e.message);
  } finally {
    runningTask = null;
    busy = false;
    sendBtn.disabled = false;
    taskBtn.disabled = false;
    stopBtn.disabled = true;
    inputEl.focus();
  }
}

// 把页面上可见的完整会话（含思考块、任务轨迹、错误提示）组织成 Markdown，
// 服务端不保存思考链与错误提示，因此以页面为准导出
function buildExportMarkdown() {
  const lines = ['# multiagent 对话导出', '', '- 导出时间: ' + new Date().toLocaleString(), '', '---', ''];
  for (const el of chatEl.children) {
    if (el.classList.contains('task-card')) {
      const title = el.querySelector('.task-title');
      lines.push('## 任务: ' + (title ? title.textContent.replace(/^(任务|技能任务)\s*>\s*/, '') : ''));
      lines.push('');
      for (const step of el.querySelectorAll('.step')) {
        const label = step.classList.contains('thought') ? '思考'
          : step.classList.contains('action') ? '行动'
          : step.classList.contains('observation') ? (step.classList.contains('error') ? '观察(失败)' : '观察')
          : step.classList.contains('final') ? '结果'
          : step.classList.contains('rework') ? '回炉' : '失败';
        const block = step.closest('.agent-block');
        const who = block ? (block.querySelector('.agent-head') || {}).textContent || '' : '';
        lines.push((who ? '[' + who + '] ' : '') + '[' + label + '] ' + step.textContent);
        lines.push('');
      }
      const meta = el.querySelector('.meta');
      if (meta) { lines.push('(' + meta.textContent + ')'); lines.push(''); }
    } else if (el.classList.contains('msg')) {
      if (el.classList.contains('error')) {
        lines.push('## 错误提示', '', el.querySelector('.bubble').textContent, '');
      } else if (el.classList.contains('user')) {
        lines.push('## 用户', '', el.querySelector('.bubble').textContent, '');
      } else {
        for (const b of el.querySelectorAll('.bubble')) {
          if (b.classList.contains('typing')) continue;
          if (b.classList.contains('thought')) {
            lines.push('[思考] ' + b.textContent, '');
          } else if (b.classList.contains('act')) {
            lines.push('[行动] ' + b.textContent, '');
          } else if (b.classList.contains('obs')) {
            lines.push('[' + (b.classList.contains('error') ? '观察(失败)' : '观察') + '] ' + b.textContent, '');
          } else {
            lines.push('## 助手', '', b.textContent, '');
          }
        }
        const meta = el.querySelector('.meta');
        if (meta) { lines.push('> ' + meta.textContent, ''); }
      }
    }
  }
  return lines.join('\n');
}

async function exportChat() {
  const md = buildExportMarkdown();
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'multiagent-export-' + stamp + '.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  let copied = false;
  try {
    await navigator.clipboard.writeText(md);
    copied = true;
  } catch (e) { /* 非安全上下文等场景剪贴板不可用 */ }
  toast(copied ? '已导出 .md 文件，并已复制到剪贴板' : '已导出 .md 文件（剪贴板不可用，请直接粘贴文件内容）');
}

function authStatusText(s) {
  return s === 'authorized' ? '已授权' : s === 'expired' ? '已过期' : '未授权';
}

function mcpCard(s) {
  const card = document.createElement('div');
  card.className = 'skill-card' + (s.enabled && s.status !== 'error' ? '' : ' off');

  const head = document.createElement('div');
  head.className = 'skill-head';
  head.appendChild(kindBadge('mcp'));
  const name = document.createElement('span');
  name.className = 'skill-name';
  name.textContent = s.name;
  const transport = document.createElement('span');
  transport.className = 'badge';
  transport.textContent = s.transport;
  const status = document.createElement('span');
  status.className = 'badge' + (s.status === 'connected' ? ' pass' : s.status === 'error' ? ' fail' : '');
  status.textContent = s.status === 'connected' ? '已连接' : s.status === 'error' ? '连接失败' : '已禁用';
  if (s.status === 'error') status.title = s.error || '';
  const source = document.createElement('span');
  source.className = 'badge';
  source.textContent = s.source + (s.enabled ? '' : ' · 已禁用');
  head.appendChild(name);
  head.appendChild(transport);
  head.appendChild(status);
  if (s.auth === 'oauth') {
    const auth = document.createElement('span');
    auth.className = 'badge' + (s.auth_status === 'authorized' ? ' pass' : s.auth_status === 'expired' ? ' fail' : '');
    auth.textContent = 'OAuth · ' + authStatusText(s.auth_status);
    head.appendChild(auth);
  }
  head.appendChild(source);
  card.appendChild(head);

  const desc = document.createElement('div');
  desc.className = 'skill-desc';
  desc.textContent = s.transport === 'stdio'
    ? '命令: ' + (s.command || []).join(' ')
    : 'Endpoint: ' + (s.url || '');
  card.appendChild(desc);
  if (s.status === 'error' && s.error) {
    const err = document.createElement('div');
    err.className = 'load-errors';
    err.textContent = s.error;
    card.appendChild(err);
  }

  const tools = document.createElement('div');
  tools.className = 'badge';
  tools.textContent = '工具: ' + ((s.tools || []).join('、') || '（无）');
  card.appendChild(tools);
  const keys = (s.env_keys || []).concat(s.header_keys || []);
  const vars = document.createElement('div');
  vars.className = 'badge';
  vars.textContent = '配置变量（值只存 .env）: ' + (keys.join('、') || '（无）');
  card.appendChild(vars);

  const actions = document.createElement('div');
  actions.className = 'skill-actions';
  const viewBtn = document.createElement('button');
  viewBtn.textContent = '查看';
  const toggleBtn = document.createElement('button');
  toggleBtn.textContent = s.enabled ? '禁用' : '启用';
  const delBtn = document.createElement('button');
  delBtn.className = 'danger';
  delBtn.textContent = '删除';
  actions.appendChild(viewBtn);
  actions.appendChild(toggleBtn);
  if (s.auth === 'oauth') {
    const reauthBtn = document.createElement('button');
    reauthBtn.textContent = '重新授权';
    reauthBtn.title = '清除已存 token 并重新走授权流（token 独立存储于 MCP_TOKEN_FILE）';
    reauthBtn.addEventListener('click', async () => {
      try {
        await postJson('/mcp/reauth', { name: s.name });
        await loadInstalled();
      } catch (e) { toast('重新授权失败：' + e.message); }
    });
    actions.appendChild(reauthBtn);
  }
  actions.appendChild(delBtn);
  card.appendChild(actions);

  const pre = document.createElement('pre');
  pre.hidden = true;
  card.appendChild(pre);

  viewBtn.addEventListener('click', () => {
    if (!pre.hidden) { pre.hidden = true; return; }
    pre.textContent = [
      'name: ' + s.name,
      'transport: ' + s.transport,
      s.transport === 'stdio'
        ? 'command: ' + (s.command || []).join(' ')
        : 'url: ' + (s.url || ''),
      'source: ' + s.source,
      'status: ' + s.status + (s.error ? '（' + s.error + '）' : ''),
      'auth: ' + (s.auth === 'oauth' ? 'oauth（' + authStatusText(s.auth_status) + '）' : 'none'),
      'env: ' + ((s.env_keys || []).join('、') || '（无）'),
      'headers: ' + ((s.header_keys || []).join('、') || '（无）'),
      'tools: ' + ((s.tools || []).join('、') || '（无）'),
    ].join('\n');
    pre.hidden = false;
  });
  toggleBtn.addEventListener('click', async () => {
    try {
      await postJson('/mcp/' + (s.enabled ? 'disable' : 'enable'), { name: s.name });
      await loadInstalled();
    } catch (e) { toast('操作失败：' + e.message); }
  });
  delBtn.addEventListener('click', async () => {
    if (!confirm('删除 MCP 服务「' + s.name + '」？（连接定义从配置文件移除）')) return;
    try {
      await postJson('/mcp/remove', { name: s.name });
      await loadInstalled();
    } catch (e) { toast('删除失败：' + e.message); }
  });
  return card;
}

function installReport(lines) {
  document.getElementById('install-report').textContent = lines.join('\n');
}

// 逐条 ✓/↷/✗ + ⚠ 警告——技能与 MCP 安装报告同形态（渲染纯文本防注入）
function renderInstallReport(data) {
  const marks = { installed: '✓', skipped: '↷', invalid: '✗' };
  installReport(
    ['来源: ' + data.source].concat(
      (data.results || []).map((r) => (marks[r.status] || '·') + ' ' + r.name + (r.detail ? ' — ' + r.detail : ' — ' + r.status)),
      (data.warnings || []).map((w) => '⚠ ' + w)
    )
  );
}

async function postJson(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const detail = typeof (data && data.detail) === 'string' ? data.detail : 'HTTP ' + res.status;
    throw new Error(detail);
  }
  return data;
}

async function installSkill(source, extra) {
  const body = Object.assign({ source }, extra || {});
  if (source === 'git') {
    body.url = document.getElementById('install-url').value.trim();
    body.subpath = document.getElementById('install-sub').value.trim();
  } else if (source === 'local') {
    body.path = document.getElementById('install-path').value.trim();
    body.subpath = document.getElementById('install-sub').value.trim();
  }
  installReport(['安装中…（目录包经爬取服务获取，只落 SKILL.md 纯提示词）']);
  try {
    const res = await fetch('/skills/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const detail = typeof (data && data.detail) === 'string' ? data.detail : 'HTTP ' + res.status;
      installReport(['安装失败：' + detail]);
      return;
    }
    renderInstallReport(data);
    invalidateSkills();
    await loadInstalled();
  } catch (e) {
    installReport(['安装失败：' + e.message]);
  }
}

async function installMcp(extra) {
  const body = Object.assign({}, extra || {});
  if (body.source === 'local') {
    body.path = document.getElementById('mcp-import-path').value.trim();
  }
  installReport(['安装中…（安装为连接定义；包由运行器运行时拉取，本期不落盘）']);
  try {
    const data = await postJson('/mcp/install', body);
    renderInstallReport(data);
    await loadInstalled();
  } catch (e) {
    installReport(['安装失败：' + e.message]);
  }
}

}

function pollRefreshState() {
  const timer = setInterval(async () => {
    let data;
    try {
      const res = await fetch('/market/sources');
      data = await res.json();
    } catch (e) { return; } // 网络抖动：下个周期再试
    renderSourceOptions(data);
    if (data.refreshing) return;
    clearInterval(timer);
    stopRefreshUi();
    marketState.page = 1;
    await loadMarketOnline();
    toast(refreshSummary(data));
  }, 5000);
}

function refreshSummary(data) {
  const parts = (data.sources || []).map((item) => item.source + ' ' + (item.entry_count || 0) + ' 条'
    + (item.last_error ? '（抓取失败: ' + String(item.last_error).slice(0, 40) + '）' : ''));
  return '刷新结束：' + (parts.join('；') || '（无源状态）');
}

async function loadMarketSources() {
  if (marketSourcesLoaded) return;
  try {
    const res = await fetch('/market/sources');
    if (!res.ok) return;
    const data = await res.json();
    renderSourceOptions(data);
  } catch (e) { /* 静默 */ }
  marketSourcesLoaded = true;
}

// 来源状态渲染（初始与刷新轮询共用）：陈旧/失败/截断告警可见
function renderSourceOptions(data) {
  const select = document.getElementById('market-source');
  const current = marketState.source;
  select.innerHTML = '';
  const all = document.createElement('option');
  all.value = '';
  all.textContent = '全部来源';
  select.appendChild(all);
  for (const item of data.sources || []) {
    const opt = document.createElement('option');
    opt.value = item.source;
    opt.textContent = item.source
      + (item.stale ? '（缓存）' : '')
      + (item.last_error ? '（上次抓取失败）' : '')
      + (item.warning ? '（告警）' : '');
    if (item.warning) opt.title = item.warning;
    select.appendChild(opt);
  }
  select.value = current;
  const box = document.getElementById('market-warnings');
  box.innerHTML = '';
  for (const item of data.sources || []) {
    if (!item.warning) continue;
    const line = document.createElement('div');
    line.textContent = item.source + '：' + item.warning;
    box.appendChild(line);
  }
}

async function loadMarketOnline() {
  if (marketOnlineDisabled) return;
  await loadMarketSources();
  const params = new URLSearchParams({
    q: marketState.q, source: marketState.source, kind: marketState.kind,
    page: String(marketState.page), page_size: String(marketState.pageSize),
  });
  let data;
  try {
    const res = await fetch('/market/search?' + params);
    if (res.status === 503) {
      marketOnlineDisabled = true;
      document.getElementById('tab-online').style.display = 'none';
      showSubTab('installed');
      toast('在线目录未启用（未配置 CATALOG_BASE_URL）');
      return;
    }
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(payload.detail || ('HTTP ' + res.status));
    data = payload;
  } catch (e) {
    document.getElementById('market-list').textContent = '';
    const err = document.createElement('div');
    err.className = 'load-errors';
    err.textContent = e.message || '在线目录暂不可用';
    document.getElementById('market-list').appendChild(err);
    return;
  }
  renderMarketRows(data);
  document.getElementById('market-freshness').textContent = data.refreshed_at
    ? ('目录更新于 ' + new Date(data.refreshed_at).toLocaleString()) : '尚未爬取';
  const pages = Math.max(1, Math.ceil((data.total || 0) / (data.page_size || marketState.pageSize)));
  document.getElementById('market-pageinfo').textContent = '第 ' + data.page + ' / ' + pages + ' 页（共 ' + (data.total || 0) + ' 条）';
}

function renderMarketRows(data) {
  const list = document.getElementById('market-list');
  list.innerHTML = '';
  if (!(data.items || []).length) {
    const empty = document.createElement('div');
    empty.className = 'skill-desc';
    empty.textContent = '没有匹配的在线条目（换个关键词，或点「刷新目录」）。';
    list.appendChild(empty);
    return;
  }
  for (const item of data.items) {
    const kind = item.kind || 'skill';
    const deprecated = item.status === 'deprecated';
    const row = document.createElement('div');
    row.className = 'market-row' + (deprecated ? ' off' : '');
    row.appendChild(kindBadge(kind));
    const name = document.createElement('span');
    name.className = 'skill-name';
    name.textContent = item.name;
    row.appendChild(name);
    const source = document.createElement('span');
    source.className = 'badge';
    source.textContent = item.source + ' · ' + (item.installs || 0) + ' 安装'
      + (item.validated && kind !== 'mcp' ? ' · 已验证' : '');
    row.appendChild(source);
    if (kind === 'mcp') {
      // 形态徽章：带包坐标 = 本地拉起（npx/uvx），无 = 远端 API
      const form = document.createElement('span');
      form.className = 'badge';
      form.textContent = (item.tags || []).length
        ? '本地包 · ' + item.tags.join('/')
        : '远程';
      row.appendChild(form);
    }
    if (item.validated && kind === 'mcp') row.appendChild(verifiedBadge());
    if (deprecated) row.appendChild(deprecatedBadge(item));
    if (kind === 'mcp' && (item.tags || []).indexOf('mcpb') >= 0) {
      const mc = document.createElement('span');
      mc.className = 'badge warn';
      mc.textContent = 'mcpb · 暂不支持安装';
      row.appendChild(mc);
    }
    if (item.is_duplicate) {
      const dup = document.createElement('span');
      dup.className = 'badge warn';
      dup.textContent = '疑似重复';
      row.appendChild(dup);
    }
    for (const a of (item.audits || [])) row.appendChild(auditBadge(a));
    const desc = document.createElement('span');
    desc.className = 'skill-desc';
    desc.textContent = (item.description || item.origin || '')
      + (deprecated && item.status_message ? '（已弃用：' + item.status_message + '）' : '');
    row.appendChild(desc);
    const installBtn = document.createElement('button');
    installBtn.textContent = '安装';
    installBtn.addEventListener('click', () => openConfirm(item));
    row.appendChild(installBtn);
    list.appendChild(row);
  }
}

function openConfirm(item) {
  confirmEntry = item;
  confirmPreview = null;
  confirmManifestText = null;
  const kind = item.kind || 'skill';
  document.getElementById('cf-name').textContent = item.name;
  document.getElementById('cf-desc').textContent = (item.description
    || (kind === 'mcp' ? '（暂无描述，以 server.json 预览为准）' : '（暂无描述，以 SKILL.md 预览为准）'))
    + (item.status === 'deprecated' && item.status_message ? '（已弃用：' + item.status_message + '）' : '');
  document.getElementById('cf-origin').textContent = '来源: ' + item.source + ' · ' + (item.origin || item.id);
  const badges = document.getElementById('cf-badges');
  badges.innerHTML = '';
  badges.appendChild(kindBadge(kind));
  const stat = document.createElement('span');
  stat.className = 'badge';
  stat.textContent = (item.installs || 0) + ' 安装' + (item.stars ? ' · ★' + item.stars : '')
    + (item.validated && kind !== 'mcp' ? ' · 已验证' : '');
  badges.appendChild(stat);
  if (item.validated && kind === 'mcp') badges.appendChild(verifiedBadge());
  if (item.status === 'deprecated') badges.appendChild(deprecatedBadge(item));
  for (const a of (item.audits || [])) badges.appendChild(auditBadge(a));
  document.getElementById('cf-caps').innerHTML = '';
  document.getElementById('cf-form').innerHTML = '';
  document.getElementById('cf-risk').textContent = '';
  const preview = document.getElementById('cf-preview');
  preview.hidden = true;
  preview.textContent = '';
  document.getElementById('cf-preview-btn').textContent = kind === 'mcp' ? '查看 server.json' : '查看 SKILL.md';
  const installBtn = document.getElementById('cf-install');
  installBtn.disabled = false;
  document.getElementById('confirm-mask').hidden = false;
  if (kind === 'mcp') {
    // 能力声明与密钥表单就绪前不允许确认（单次确认 = 安装 + 密钥收集）
    installBtn.disabled = true;
    loadConfirmCapability(item);
  }
}

async function loadConfirmCapability(item) {
  const caps = document.getElementById('cf-caps');
  const loading = document.createElement('div');
  loading.className = 'cap-line';
  loading.textContent = '能力声明加载中…（经爬取服务取详情）';
  caps.appendChild(loading);
  try {
    const params = new URLSearchParams({ id: item.install_ref || item.id, source: item.source });
    const res = await fetch('/market/detail?' + params);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    if (confirmEntry !== item) return; // 卡片已关闭或已换条目
    confirmManifestText = data.manifest_text || '';
    let manifest = {};
    try { manifest = JSON.parse(confirmManifestText); } catch (e) { manifest = {}; }
    confirmPreview = manifest.install_preview || null;
    renderCapability(manifest);
    document.getElementById('cf-install').disabled = !(confirmPreview && confirmPreview.transport);
  } catch (e) {
    if (confirmEntry !== item) return;
    caps.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'load-errors';
    err.textContent = '能力声明加载失败：' + e.message + '（无法确认能力与密钥，禁止安装）';
    caps.appendChild(err);
    document.getElementById('cf-install').disabled = true;
  }
}

function renderCapability(manifest) {
  const caps = document.getElementById('cf-caps');
  caps.innerHTML = '';
  const form = document.getElementById('cf-form');
  form.innerHTML = '';
  const risk = document.getElementById('cf-risk');
  risk.textContent = '';
  const preview = confirmPreview || {};
  const addLine = (text, mono) => {
    const line = document.createElement('div');
    line.className = 'cap-line' + (mono ? ' cmd' : '');
    line.textContent = text;
    caps.appendChild(line);
  };
  if (preview.transport === 'stdio') {
    addLine('拼装后命令原文（argv 直起子进程，不经 shell）:');
    addLine((preview.command || []).join(' '), true);
    addLine('宿主运行器: ' + (preview.runtime_hint || '（无，需完整路径）'));
    risk.textContent = '确认 = 授权本机执行该命令';
  } else if (preview.transport === 'streamable-http') {
    addLine('Endpoint（streamable-http）:');
    addLine(preview.url || '', true);
    addLine('域名: ' + hostOf(preview.url || ''));
    if (preview.auth === 'oauth') {
      addLine('授权: OAuth 动态授权流（' + (preview.auth_flow && preview.auth_flow !== 'auto'
        ? preview.auth_flow : '授权码 + PKCE，无头环境用设备码') + '，token 独立存储并自动刷新，不进 .env）');
      risk.textContent = '确认 = 授权本服务连接该远程端点并在终端完成 OAuth 授权';
    } else {
      risk.textContent = '确认 = 授权本服务连接该远程端点并发送所填密钥';
    }
  } else {
    addLine('暂不支持安装：' + (preview.reason || '条目无可安装形态'));
  }
  const repo = manifest.repository && manifest.repository.url;
  if (repo) addLine('仓库: ' + repo);
  // 密钥/环境变量表单：按结构化声明渲染（isSecret 走密码框，choices 走下拉）
  const decls = (preview.env || []).concat(preview.headers || []);
  for (const decl of decls) form.appendChild(cfField(decl));
  if (decls.length) {
    const note = document.createElement('div');
    note.className = 'skill-desc';
    note.textContent = '密钥值只写入 .env，连接定义仅存 ${VAR} 占位；留空按空值配置。';
    form.appendChild(note);
  }
}

function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return '（无法解析）'; }
}

function cfField(decl) {
  const wrap = document.createElement('div');
  wrap.className = 'cf-field';
  const label = document.createElement('label');
  label.textContent = decl.name
    + (decl.isRequired ? '（必填）' : '')
    + (decl.isSecret ? '（密钥）' : '');
  wrap.appendChild(label);
  let input;
  if ((decl.choices || []).length) {
    input = document.createElement('select');
    if (!decl.isRequired) {
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = '（留空）';
      input.appendChild(blank);
    }
    for (const choice of decl.choices) {
      const opt = document.createElement('option');
      opt.value = choice;
      opt.textContent = choice;
      input.appendChild(opt);
    }
    input.value = decl.default || '';
  } else {
    input = document.createElement('input');
    input.type = decl.isSecret ? 'password' : 'text';
    input.value = decl.default || '';
    input.placeholder = decl.isSecret ? '（写入 .env，不进连接定义）' : '';
  }
  input.dataset.var = decl.var;
  input.dataset.name = decl.name;
  if (decl.isRequired) input.dataset.required = '1';
  wrap.appendChild(input);
  return wrap;
}

// 收集密钥/环境变量值：键 = ${VAR} 占位名；必填留空则给出缺失项
function collectEnvValues() {
  const values = {};
  for (const input of document.querySelectorAll('#cf-form [data-var]')) {
    const value = input.value;
    if (input.dataset.required === '1' && !value.trim()) {
      return { missing: input.dataset.name };
    }
    values[input.dataset.var] = value;
  }
  return { values };
}

async function toggleCfPreview() {
  if (!confirmEntry) return;
  const pre = document.getElementById('cf-preview');
  if (!pre.hidden) { pre.hidden = true; return; }
  pre.hidden = false;
  if ((confirmEntry.kind || 'skill') === 'mcp' && confirmManifestText !== null) {
    pre.textContent = confirmManifestText || '（无内容）';
    return;
  }
  pre.textContent = '预览加载中…（目录包经爬取服务获取）';
  try {
    const params = new URLSearchParams({ id: confirmEntry.install_ref || confirmEntry.id, source: confirmEntry.source });
    const res = await fetch('/market/detail?' + params);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    pre.textContent = data.manifest_text || '（无内容）';
    for (const a of (data.audits || [])) document.getElementById('cf-badges').appendChild(auditBadge(a));
  } catch (e) {
    pre.textContent = '预览不可用：' + e.message;
  }
}

async function confirmInstall() {
  if (!confirmEntry) return;
  const entry = confirmEntry;
  if ((entry.kind || 'skill') === 'mcp') {
    if (!confirmPreview || !confirmPreview.transport) {
      toast('该条目暂不支持安装');
      return;
    }
    const collected = collectEnvValues();
    if (collected.missing) {
      toast('请填写必填项：' + collected.missing);
      return;
    }
    confirmEntry = null;
    document.getElementById('confirm-mask').hidden = true;
    showSubTab('installed');
    await installMcp({
      source: 'catalog',
      catalog_id: entry.install_ref || entry.id,
      source_platform: entry.source,
      env_values: collected.values,
    });
    return;
  }
  confirmEntry = null;
  document.getElementById('confirm-mask').hidden = true;
  showSubTab('installed');
  await installSkill('catalog', { catalog_id: entry.install_ref || entry.id, source_platform: entry.source });
}

sendBtn.addEventListener('click', send);
taskBtn.addEventListener('click', runAgent);
stopBtn.addEventListener('click', async () => {
  // 叫停任务：按 task_id 定位（在跑的任务才有 id），以 partial 收尾并展示已有进展
  try {
    const body = runningTask && runningTask.taskId
      ? { task_id: runningTask.taskId }
      : (sessionId ? { session_id: sessionId } : {});
    const res = await fetch('/agent/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    toast(data.stopped ? '已请求叫停，任务将带着已有进展收尾' : '当前没有正在运行的任务');
  } catch (e) {
    toast('叫停失败：' + e.message);
  }
});
clearBtn.addEventListener('click', newSession);
document.getElementById('new-session-btn').addEventListener('click', newSession);
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('hidden');
});
exportBtn.addEventListener('click', exportChat);
marketBtn.addEventListener('click', () => {
  showView(skillsViewEl.style.display === 'flex' ? 'chat' : 'market');
});
document.getElementById('install-git-btn').addEventListener('click', () => installSkill('git'));
document.getElementById('install-local-btn').addEventListener('click', () => installSkill('local'));
document.getElementById('preset-select').addEventListener('change', (e) => {
  const opt = e.target.selectedOptions[0];
  if (opt && opt.value) {
    document.getElementById('install-url').value = opt.value;
    document.getElementById('install-sub').value = opt.dataset.subpath || '';
  }
});
document.getElementById('kind-skill').addEventListener('click', () => showKind('skill'));
document.getElementById('kind-mcp').addEventListener('click', () => showKind('mcp'));
document.getElementById('tab-installed').addEventListener('click', () => showSubTab('installed'));
document.getElementById('tab-online').addEventListener('click', () => showSubTab('online'));
document.getElementById('mcp-import-btn').addEventListener('click', () => installMcp({ source: 'local' }));
document.getElementById('mcp-reload-btn').addEventListener('click', async () => {
  try {
    await postJson('/mcp/reload', {});
    toast('已重载连接定义');
    await loadInstalled();
  } catch (e) { toast('重载失败：' + e.message); }
});
document.getElementById('market-search-btn').addEventListener('click', () => {
  marketState.q = document.getElementById('market-q').value.trim();
  marketState.page = 1;
  loadMarketOnline();
});
document.getElementById('market-q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    marketState.q = e.target.value.trim();
    marketState.page = 1;
    loadMarketOnline();
  }
});
document.getElementById('market-source').addEventListener('change', (e) => {
  marketState.source = e.target.value;
  marketState.page = 1;
  loadMarketOnline();
});
document.getElementById('market-prev').addEventListener('click', () => {
  if (marketState.page > 1) { marketState.page -= 1; loadMarketOnline(); }
});
document.getElementById('market-next').addEventListener('click', () => {
  marketState.page += 1;
  loadMarketOnline();
});
document.getElementById('market-refresh-btn').addEventListener('click', () => refreshCatalog());
document.getElementById('cf-preview-btn').addEventListener('click', toggleCfPreview);
document.getElementById('cf-cancel').addEventListener('click', () => {
  document.getElementById('confirm-mask').hidden = true;
  confirmEntry = null;
});
document.getElementById('cf-install').addEventListener('click', confirmInstall);

inputEl.addEventListener('keydown', (e) => {
  if (slashOpen()) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      slashIndex = (slashIndex + 1) % slashHits.length;
      updateSlashPop();
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      slashIndex = (slashIndex - 1 + slashHits.length) % slashHits.length;
      updateSlashPop();
      return;
    }
    if (e.key === 'Tab' || e.key === 'Enter') {
      e.preventDefault();
      pickSlash(slashHits[slashIndex].name);
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      hideSlashPop();
      return;
    }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = '46px';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  updateSlashPop();
});
inputEl.addEventListener('blur', () => setTimeout(hideSlashPop, 150));

loadProviders();
restoreSession();
inputEl.focus();
</script>
