<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multiagent 对话</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1d2230;
    --border: #2a3040;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent-2: #2f6fe0;
    --user-bubble: #2b5fd9;
    --assistant-bubble: #1d2230;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  select, button, input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  input { cursor: text; }
  select:hover, button:hover { border-color: var(--accent); }
  #clear-btn:hover { border-color: var(--error); color: var(--error); }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); }
  .msg.error .bubble { background: transparent; border: 1px solid var(--error); color: var(--error); border-radius: 12px; }
  .bubble.thought {
    background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-size: 12.5px; width: 100%;
  }
  .bubble.thought::before {
    content: "思考"; display: block; font-size: 11px;
    opacity: 0.75; margin-bottom: 2px;
  }
  .bubble.act {
    background: transparent; border: 1px dashed var(--accent-2); color: var(--accent);
    font-family: Consolas, "Courier New", monospace; font-size: 12.5px; width: 100%;
  }
  .bubble.obs {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); font-size: 12.5px; width: 100%;
  }
  .bubble.obs.error { color: var(--error); border-color: var(--error); }
  #toast {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; }
  .typing { display: inline-flex; gap: 4px; padding: 12px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #input {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: inherit;
    height: 46px; max-height: 140px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent-2); border: none; color: #fff;
    padding: 0 22px; border-radius: 10px; font-size: 14px;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #send-btn:hover:not(:disabled) { background: var(--accent); }
  #task-btn {
    background: transparent; border: 1px solid var(--accent-2); color: var(--accent);
    padding: 0 16px; border-radius: 10px; font-size: 13px;
  }
  #task-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #task-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }

  /* ===== Agent 任务时间线 ===== */
  .task-card {
    align-self: flex-start; max-width: 86%;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .task-title { font-size: 12px; color: var(--muted); }
  .task-card .step { font-size: 13px; line-height: 1.6; }
  .step.thought { color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .step.action { color: var(--accent); font-family: Consolas, "Courier New", monospace; font-size: 12.5px; }
  .step.observation {
    color: var(--text); background: var(--panel-2); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .step.observation.error { color: var(--error); }
  .step.final, .step.failed {
    white-space: pre-wrap; word-break: break-word; font-weight: 600;
    border-top: 1px solid var(--border); padding-top: 8px;
  }
  .step.failed { color: var(--error); }

  /* ===== /技能名 弹层 ===== */
  #slash-pop {
    position: fixed; left: 20px; bottom: 74px; width: 360px; max-height: 280px;
    overflow-y: auto; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; z-index: 20; display: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .slash-item {
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline;
  }
  .slash-item.active, .slash-item:hover { background: var(--accent-2); }
  .slash-name { font-weight: 600; white-space: nowrap; }
  .slash-desc { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slash-item.active .slash-desc, .slash-item:hover .slash-desc { color: var(--text); }
  .slash-hint { padding: 6px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
</style>
</head>
<body>
  <header>
    <h1>multiagent</h1>
    <span class="meta" id="default-hint"></span>
    <div class="spacer"></div>
    <select id="provider-select" title="选择厂商">
      <option value="">默认厂商</option>
    </select>
    <button id="export-btn" title="导出对话记录为 Markdown（含任务轨迹与错误，可直接粘贴给 AI）">导出</button>
    <button id="clear-btn" title="清空服务端对话上下文并清屏">清空</button>
  </header>

  <div id="chat">
    <div class="msg assistant"><div class="bubble">你好！我是 multiagent，输入消息开始对话；输入 / 可快速点名技能。</div></div>
  </div>

  <footer>
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行；输入 / 弹出技能列表，Tab 选中" autofocus></textarea>
    <button id="task-btn" title="作为自主多步任务执行（思考→行动→观察）">任务</button>
    <button id="send-btn">发送</button>
  </footer>

  <div id="slash-pop"></div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const taskBtn = document.getElementById('task-btn');
const clearBtn = document.getElementById('clear-btn');
const exportBtn = document.getElementById('export-btn');
const providerEl = document.getElementById('provider-select');
const defaultHintEl = document.getElementById('default-hint');
const slashPopEl = document.getElementById('slash-pop');
let busy = false;
let toastTimer = null;

function toast(text) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role, text, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if (meta) addMeta(wrap, meta);
  chatEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function addMeta(wrap, text) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = text;
  wrap.appendChild(m);
}

// 解析 SSE 字节流为事件对象（data: {...}\n\n）
async function* readSse(stream) {
  const reader = stream.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const frame = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      for (const line of frame.split('\n')) {
        if (line.startsWith('data: ')) yield JSON.parse(line.slice(6));
      }
    }
  }
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  chatEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

// 任务时间线卡片：/agent/stream 与 /技能名 路由共用
function makeTaskCard(title) {
  const card = document.createElement('div');
  card.className = 'task-card';
  const titleEl = document.createElement('div');
  titleEl.className = 'task-title';
  titleEl.textContent = title;
  card.appendChild(titleEl);
  chatEl.appendChild(card);
  scrollToBottom();
  const addStep = (className, textContent) => {
    const step = document.createElement('div');
    step.className = 'step ' + className;
    if (textContent !== undefined) step.textContent = textContent;
    card.appendChild(step);
    scrollToBottom();
    return step;
  };
  return { card, addStep };
}

async function loadProviders() {
  try {
    const res = await fetch('/providers');
    const data = await res.json();
    defaultHintEl.textContent = '默认: ' + data.default;
    for (const [name, info] of Object.entries(data.providers)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name + (info.configured ? '' : '（未配置 Key）');
      if (!info.configured) opt.disabled = true;
      if (name === data.default) opt.textContent += '（默认）';
      providerEl.appendChild(opt);
    }
  } catch (e) { /* 服务不可用时静默 */ }
}

// ===== 技能列表数据（/ 弹层与市场共用，操作后失效重取） =====
let skillCache = null;

async function fetchSkills(force) {
  if (skillCache && !force) return skillCache;
  try {
    const res = await fetch('/skills');
    skillCache = await res.json();
  } catch (e) {
    skillCache = { skills: [], load_errors: ['技能列表加载失败：' + e.message] };
  }
  return skillCache;
}

function invalidateSkills() { skillCache = null; }

// ===== /技能名 弹层：搜索 + ↑↓ + Tab/Enter 选中插入 =====
let slashHits = [];
let slashIndex = 0;

function slashQuery() {
  const value = inputEl.value;
  if (!value.startsWith('/') || /\s/.test(value)) return null;
  return value.slice(1);
}

async function updateSlashPop() {
  const query = slashQuery();
  if (query === null) { hideSlashPop(); return; }
  const data = await fetchSkills();
  const q = query.toLowerCase();
  slashHits = data.skills
    .filter((s) => s.enabled)
    .filter((s) => s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q))
    .slice(0, 8);
  if (!slashHits.length) { hideSlashPop(); return; }
  slashIndex = Math.min(slashIndex, slashHits.length - 1);
  slashPopEl.innerHTML = '';
  slashHits.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'slash-item' + (i === slashIndex ? ' active' : '');
    const name = document.createElement('span');
    name.className = 'slash-name';
    name.textContent = '/' + s.name;
    const desc = document.createElement('span');
    desc.className = 'slash-desc';
    desc.textContent = s.description;
    item.appendChild(name);
    item.appendChild(desc);
    item.addEventListener('mousedown', (e) => { e.preventDefault(); pickSlash(s.name); });
    slashPopEl.appendChild(item);
  });
  const hint = document.createElement('div');
  hint.className = 'slash-hint';
  hint.textContent = '↑↓ 选择 · Tab/Enter 插入技能名 · Esc 关闭';
  slashPopEl.appendChild(hint);
  slashPopEl.style.display = 'block';
}

function hideSlashPop() {
  slashPopEl.style.display = 'none';
  slashHits = [];
  slashIndex = 0;
}

function pickSlash(name) {
  inputEl.value = '/' + name + ' ';
  hideSlashPop();
  inputEl.focus();
}

function slashOpen() {
  return slashPopEl.style.display === 'block' && slashHits.length > 0;
}

// ===== 发送：普通聊天（迷你技能循环）或 /技能名 路由的任务流 =====
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  hideSlashPop();
  busy = true;
  sendBtn.disabled = true;
  taskBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = '46px';
  addMessage('user', text);

  const typing = addTyping();
  const body = { message: text };
  if (providerEl.value) body.provider = providerEl.value;
  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    typing.remove();
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      const detail = typeof (err && err.detail) === 'string'
        ? err.detail : (err && err.detail ? JSON.stringify(err.detail) : 'HTTP ' + res.status);
      addMessage('error', '出错了：' + detail);
      return;
    }
    let wrap = null, bubble = null, thoughtEl = null;
    let task = null, taskThought = null;
    const ensureWrap = () => {
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.className = 'msg assistant';
        chatEl.appendChild(wrap);
      }
      return wrap;
    };
    const ensureBubble = () => {
      if (!bubble) {
        bubble = document.createElement('div');
        bubble.className = 'bubble';
        ensureWrap().appendChild(bubble);
      }
      scrollToBottom();
      return bubble;
    };
    for await (const evt of readSse(res.body)) {
      if (evt.type === 'task_started') {
        // /技能名 前缀路由：服务端升级为任务通道，按时间线渲染
        task = makeTaskCard('技能任务 > ' + text);
        continue;
      }
      if (task) {
        if (evt.type === 'thought_delta') {
          if (!taskThought) taskThought = task.addStep('thought', '');
          taskThought.textContent += evt.text;
        } else if (evt.type === 'action') {
          taskThought = null;
          task.addStep('action', '→ ' + evt.tool + '(' + JSON.stringify(evt.arguments) + ')');
        } else if (evt.type === 'observation') {
          task.addStep('observation' + (evt.is_error ? ' error' : ''), evt.text);
        } else if (evt.type === 'final') {
          taskThought = null;
          task.addStep('final', evt.answer + (evt.status === 'partial' ? '\n（部分完成——预算耗尽，以上为已有进展）' : ''));
          addMeta(task.card, evt.iterations + ' 轮');
        } else if (evt.type === 'failed') {
          taskThought = null;
          task.addStep('failed', '任务失败：' + evt.reason + '（第 ' + evt.iterations + ' 轮）');
        }
        scrollToBottom();
        continue;
      }
      if (evt.type === 'reasoning_delta') {
        if (!thoughtEl) {
          thoughtEl = document.createElement('div');
          thoughtEl.className = 'bubble thought';
          ensureWrap().appendChild(thoughtEl);
        }
        thoughtEl.textContent += evt.text;
      } else if (evt.type === 'delta') {
        ensureBubble().textContent += evt.text;
      } else if (evt.type === 'action') {
        // 技能步骤：动作另起气泡，随后的增量（回答）与上文分开
        bubble = null;
        const step = document.createElement('div');
        step.className = 'bubble act';
        step.textContent = '→ ' + evt.tool + '(' + JSON.stringify(evt.arguments) + ')';
        ensureWrap().appendChild(step);
      } else if (evt.type === 'observation') {
        bubble = null;
        const step = document.createElement('div');
        step.className = 'bubble obs' + (evt.is_error ? ' error' : '');
        step.textContent = evt.text;
        ensureWrap().appendChild(step);
      } else if (evt.type === 'done') {
        addMeta(ensureWrap(), evt.provider + ' / ' + evt.model);
      } else if (evt.type === 'error') {
        ensureWrap().classList.add('error');
        ensureBubble().textContent = '出错了：' + evt.detail;
      }
      scrollToBottom();
    }
    if (!task && bubble && !bubble.textContent) bubble.textContent = '（空回复）';
    scrollToBottom();
  } catch (e) {
    typing.remove();
    addMessage('error', '网络错误：' + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    taskBtn.disabled = false;
    inputEl.focus();
  }
}

async function runAgent() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  hideSlashPop();
  busy = true;
  sendBtn.disabled = true;
  taskBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = '46px';

  const body = { task: text };
  if (providerEl.value) body.provider = providerEl.value;

  const task = makeTaskCard('任务 > ' + text);
  const addStep = task.addStep;
  // 思考流式追加的目标；动作开始后置空，下一轮思考另起一段
  let thoughtEl = null;
  const closeThought = () => { thoughtEl = null; };

  try {
    const res = await fetch('/agent/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok || !res.body) {
      const err = await res.json().catch(() => null);
      const detail = typeof (err && err.detail) === 'string'
        ? err.detail : 'HTTP ' + res.status;
      addStep('failed', '出错了：' + detail);
      return;
    }
    for await (const evt of readSse(res.body)) {
      if (evt.type === 'task_started') continue;
      if (evt.type === 'thought_delta') {
        if (!thoughtEl) thoughtEl = addStep('thought', '');
        thoughtEl.textContent += evt.text;
        scrollToBottom();
      } else if (evt.type === 'action') {
        closeThought();
        addStep('action', '→ ' + evt.tool + '(' + JSON.stringify(evt.arguments) + ')');
      } else if (evt.type === 'observation') {
        addStep('observation' + (evt.is_error ? ' error' : ''), evt.text);
      } else if (evt.type === 'final') {
        closeThought();
        addStep('final', evt.answer + (evt.status === 'partial' ? '\n（部分完成——预算耗尽，以上为已有进展）' : ''));
        addMeta(task.card, evt.iterations + ' 轮');
      } else if (evt.type === 'failed') {
        closeThought();
        addStep('failed', '任务失败：' + evt.reason + '（第 ' + evt.iterations + ' 轮）');
      }
    }
  } catch (e) {
    addStep('failed', '网络错误：' + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    taskBtn.disabled = false;
    inputEl.focus();
  }
}

async function clearChat() {
  try { await fetch('/reset', { method: 'POST' }); } catch (e) { /* 忽略 */ }
  chatEl.innerHTML = '';
  addMessage('assistant', '已清空对话上下文。');
}

// 把页面上可见的完整会话（含思考块、任务轨迹、错误提示）组织成 Markdown，
// 服务端不保存思考链与错误提示，因此以页面为准导出
function buildExportMarkdown() {
  const lines = ['# multiagent 对话导出', '', '- 导出时间: ' + new Date().toLocaleString(), '', '---', ''];
  for (const el of chatEl.children) {
    if (el.classList.contains('task-card')) {
      const title = el.querySelector('.task-title');
      lines.push('## 任务: ' + (title ? title.textContent.replace(/^(任务|技能任务)\s*>\s*/, '') : ''));
      lines.push('');
      for (const step of el.querySelectorAll('.step')) {
        const label = step.classList.contains('thought') ? '思考'
          : step.classList.contains('action') ? '行动'
          : step.classList.contains('observation') ? (step.classList.contains('error') ? '观察(失败)' : '观察')
          : step.classList.contains('final') ? '结果' : '失败';
        lines.push('[' + label + '] ' + step.textContent);
        lines.push('');
      }
      const meta = el.querySelector('.meta');
      if (meta) { lines.push('(' + meta.textContent + ')'); lines.push(''); }
    } else if (el.classList.contains('msg')) {
      if (el.classList.contains('error')) {
        lines.push('## 错误提示', '', el.querySelector('.bubble').textContent, '');
      } else if (el.classList.contains('user')) {
        lines.push('## 用户', '', el.querySelector('.bubble').textContent, '');
      } else {
        for (const b of el.querySelectorAll('.bubble')) {
          if (b.classList.contains('typing')) continue;
          if (b.classList.contains('thought')) {
            lines.push('[思考] ' + b.textContent, '');
          } else if (b.classList.contains('act')) {
            lines.push('[行动] ' + b.textContent, '');
          } else if (b.classList.contains('obs')) {
            lines.push('[' + (b.classList.contains('error') ? '观察(失败)' : '观察') + '] ' + b.textContent, '');
          } else {
            lines.push('## 助手', '', b.textContent, '');
          }
        }
        const meta = el.querySelector('.meta');
        if (meta) { lines.push('> ' + meta.textContent, ''); }
      }
    }
  }
  return lines.join('\n');
}

async function exportChat() {
  const md = buildExportMarkdown();
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'multiagent-export-' + stamp + '.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  let copied = false;
  try {
    await navigator.clipboard.writeText(md);
    copied = true;
  } catch (e) { /* 非安全上下文等场景剪贴板不可用 */ }
  toast(copied ? '已导出 .md 文件，并已复制到剪贴板' : '已导出 .md 文件（剪贴板不可用，请直接粘贴文件内容）');
}

sendBtn.addEventListener('click', send);
taskBtn.addEventListener('click', runAgent);
clearBtn.addEventListener('click', clearChat);
exportBtn.addEventListener('click', exportChat);

inputEl.addEventListener('keydown', (e) => {
  if (slashOpen()) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      slashIndex = (slashIndex + 1) % slashHits.length;
      updateSlashPop();
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      slashIndex = (slashIndex - 1 + slashHits.length) % slashHits.length;
      updateSlashPop();
      return;
    }
    if (e.key === 'Tab' || e.key === 'Enter') {
      e.preventDefault();
      pickSlash(slashHits[slashIndex].name);
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      hideSlashPop();
      return;
    }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = '46px';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  updateSlashPop();
});
inputEl.addEventListener('blur', () => setTimeout(hideSlashPop, 150));

loadProviders();
inputEl.focus();
</script>
