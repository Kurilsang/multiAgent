<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multiagent 对话</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1d2230;
    --border: #2a3040;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent-2: #2f6fe0;
    --user-bubble: #2b5fd9;
    --assistant-bubble: #1d2230;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover { border-color: var(--accent); }
  #clear-btn:hover { border-color: var(--error); color: var(--error); }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); }
  .msg.error .bubble { background: transparent; border: 1px solid var(--error); color: var(--error); border-radius: 12px; }
  .bubble.thought {
    background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-size: 12.5px; width: 100%;
  }
  .bubble.thought::before {
    content: "思考"; display: block; font-size: 11px;
    opacity: 0.75; margin-bottom: 2px;
  }
  #toast {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; }
  .typing { display: inline-flex; gap: 4px; padding: 12px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #input {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: inherit;
    height: 46px; max-height: 140px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent-2); border: none; color: #fff;
    padding: 0 22px; border-radius: 10px; font-size: 14px;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #send-btn:hover:not(:disabled) { background: var(--accent); }
  #task-btn {
    background: transparent; border: 1px solid var(--accent-2); color: var(--accent);
    padding: 0 16px; border-radius: 10px; font-size: 13px;
  }
  #task-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #task-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }

  /* ===== Agent 任务时间线 ===== */
  .task-card {
    align-self: flex-start; max-width: 86%;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .task-title { font-size: 12px; color: var(--muted); }
  .task-card .step { font-size: 13px; line-height: 1.6; }
  .step.thought { color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .step.action { color: var(--accent); font-family: Consolas, "Courier New", monospace; font-size: 12.5px; }
  .step.observation {
    color: var(--text); background: var(--panel-2); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .step.observation.error { color: var(--error); }
  .step.final, .step.failed {
    white-space: pre-wrap; word-break: break-word; font-weight: 600;
    border-top: 1px solid var(--border); padding-top: 8px;
  }
  .step.failed { color: var(--error); }
</style>
</head>
<body>
  <header>
    <h1>multiagent</h1>
    <span class="meta" id="default-hint"></span>
    <div class="spacer"></div>
    <select id="provider-select" title="选择厂商">
      <option value="">默认厂商</option>
    </select>
    <button id="export-btn" title="导出对话记录为 Markdown（含任务轨迹与错误，可直接粘贴给 AI）">导出</button>
    <button id="clear-btn" title="清空服务端对话上下文并清屏">清空</button>
  </header>

  <div id="chat">
    <div class="msg assistant"><div class="bubble">你好！我是 multiagent，输入消息开始对话。</div></div>
  </div>

  <footer>
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" autofocus></textarea>
    <button id="task-btn" title="作为自主多步任务执行（思考→行动→观察）">任务</button>
    <button id="send-btn">发送</button>
  </footer>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const taskBtn = document.getElementById('task-btn');
const clearBtn = document.getElementById('clear-btn');
const exportBtn = document.getElementById('export-btn');
const providerEl = document.getElementById('provider-select');
const defaultHintEl = document.getElementById('default-hint');
let busy = false;
let toastTimer = null;

function toast(text) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role, text, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if (meta) addMeta(wrap, meta);
  chatEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function addMeta(wrap, text) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = text;
  wrap.appendChild(m);
}

// 解析 SSE 字节流为事件对象（data: {...}\n\n）
async function* readSse(stream) {
  const reader = stream.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const frame = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      for (const line of frame.split('\n')) {
        if (line.startsWith('data: ')) yield JSON.parse(line.slice(6));
      }
    }
  }
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  chatEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

async function loadProviders() {
  try {
    const res = await fetch('/providers');
    const data = await res.json();
    defaultHintEl.textContent = '默认: ' + data.default;
    for (const [name, info] of Object.entries(data.providers)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name + (info.configured ? '' : '（未配置 Key）');
      if (!info.configured) opt.disabled = true;
      if (name === data.default) opt.textContent += '（默认）';
      providerEl.appendChild(opt);
    }
  } catch (e) { /* 服务不可用时静默 */ }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = '46px';
  addMessage('user', text);

  const typing = addTyping();
  const body = { message: text };
  if (providerEl.value) body.provider = providerEl.value;
  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    typing.remove();
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      const detail = typeof (err && err.detail) === 'string'
        ? err.detail : (err && err.detail ? JSON.stringify(err.detail) : 'HTTP ' + res.status);
      addMessage('error', '出错了：' + detail);
      return;
    }
    const wrap = addMessage('assistant', '');
    const bubble = wrap.querySelector('.bubble');
    // 思考流式追加的目标；首个回复增量到达前懒创建，独立成块不混入回答
    let thoughtEl = null;
    for await (const evt of readSse(res.body)) {
      if (evt.type === 'reasoning_delta') {
        if (!thoughtEl) {
          thoughtEl = document.createElement('div');
          thoughtEl.className = 'bubble thought';
          wrap.insertBefore(thoughtEl, bubble);
        }
        thoughtEl.textContent += evt.text;
        scrollToBottom();
      } else if (evt.type === 'delta') {
        bubble.textContent += evt.text;
        scrollToBottom();
      } else if (evt.type === 'done') {
        addMeta(wrap, evt.provider + ' / ' + evt.model);
      } else if (evt.type === 'error') {
        wrap.classList.add('error');
        bubble.textContent = '出错了：' + evt.detail;
      }
    }
    if (!bubble.textContent) bubble.textContent = '（空回复）';
    scrollToBottom();
  } catch (e) {
    typing.remove();
    addMessage('error', '网络错误：' + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function runAgent() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  taskBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = '46px';

  const body = { task: text };
  if (providerEl.value) body.provider = providerEl.value;

  const card = document.createElement('div');
  card.className = 'task-card';
  const title = document.createElement('div');
  title.className = 'task-title';
  title.textContent = '任务 > ' + text;
  card.appendChild(title);
  chatEl.appendChild(card);
  scrollToBottom();

  // 思考流式追加的目标；动作开始后置空，下一轮思考另起一段
  let thoughtEl = null;
  const closeThought = () => { thoughtEl = null; };
  const addStep = (className, textContent) => {
    const step = document.createElement('div');
    step.className = 'step ' + className;
    if (textContent !== undefined) step.textContent = textContent;
    card.appendChild(step);
    scrollToBottom();
    return step;
  };

  try {
    const res = await fetch('/agent/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok || !res.body) {
      const err = await res.json().catch(() => null);
      const detail = typeof (err && err.detail) === 'string'
        ? err.detail : 'HTTP ' + res.status;
      addStep('failed', '出错了：' + detail);
      return;
    }
    for await (const evt of readSse(res.body)) {
      if (evt.type === 'task_started') continue;
      if (evt.type === 'thought_delta') {
        if (!thoughtEl) thoughtEl = addStep('thought', '');
        thoughtEl.textContent += evt.text;
        scrollToBottom();
      } else if (evt.type === 'action') {
        closeThought();
        addStep('action', '→ ' + evt.tool + '(' + JSON.stringify(evt.arguments) + ')');
      } else if (evt.type === 'observation') {
        addStep('observation' + (evt.is_error ? ' error' : ''), evt.text);
      } else if (evt.type === 'final') {
        closeThought();
        addStep('final', evt.answer + (evt.status === 'partial' ? '\n（部分完成——预算耗尽，以上为已有进展）' : ''));
        addMeta(card, evt.iterations + ' 轮');
      } else if (evt.type === 'failed') {
        closeThought();
        addStep('failed', '任务失败：' + evt.reason + '（第 ' + evt.iterations + ' 轮）');
      }
    }
  } catch (e) {
    addStep('failed', '网络错误：' + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    taskBtn.disabled = false;
    inputEl.focus();
  }
}

async function clearChat() {
  try { await fetch('/reset', { method: 'POST' }); } catch (e) { /* 忽略 */ }
  chatEl.innerHTML = '';
  addMessage('assistant', '已清空对话上下文。');
}

// 把页面上可见的完整会话（含思考块、任务轨迹、错误提示）组织成 Markdown，
// 服务端不保存思考链与错误提示，因此以页面为准导出
function buildExportMarkdown() {
  const lines = ['# multiagent 对话导出', '', '- 导出时间: ' + new Date().toLocaleString(), '', '---', ''];
  for (const el of chatEl.children) {
    if (el.classList.contains('task-card')) {
      const title = el.querySelector('.task-title');
      lines.push('## 任务: ' + (title ? title.textContent.replace(/^任务\s*>\s*/, '') : ''));
      lines.push('');
      for (const step of el.querySelectorAll('.step')) {
        const label = step.classList.contains('thought') ? '思考'
          : step.classList.contains('action') ? '行动'
          : step.classList.contains('observation') ? (step.classList.contains('error') ? '观察(失败)' : '观察')
          : step.classList.contains('final') ? '结果' : '失败';
        lines.push('[' + label + '] ' + step.textContent);
        lines.push('');
      }
      const meta = el.querySelector('.meta');
      if (meta) { lines.push('(' + meta.textContent + ')'); lines.push(''); }
    } else if (el.classList.contains('msg')) {
      if (el.classList.contains('error')) {
        lines.push('## 错误提示', '', el.querySelector('.bubble').textContent, '');
      } else if (el.classList.contains('user')) {
        lines.push('## 用户', '', el.querySelector('.bubble').textContent, '');
      } else {
        for (const b of el.querySelectorAll('.bubble')) {
          if (b.classList.contains('typing')) continue;
          if (b.classList.contains('thought')) {
            lines.push('[思考] ' + b.textContent, '');
          } else {
            lines.push('## 助手', '', b.textContent, '');
          }
        }
        const meta = el.querySelector('.meta');
        if (meta) { lines.push('> ' + meta.textContent, ''); }
      }
    }
  }
  return lines.join('\n');
}

async function exportChat() {
  const md = buildExportMarkdown();
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'multiagent-export-' + stamp + '.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  let copied = false;
  try {
    await navigator.clipboard.writeText(md);
    copied = true;
  } catch (e) { /* 非安全上下文等场景剪贴板不可用 */ }
  toast(copied ? '已导出 .md 文件，并已复制到剪贴板' : '已导出 .md 文件（剪贴板不可用，请直接粘贴文件内容）');
}

sendBtn.addEventListener('click', send);
taskBtn.addEventListener('click', runAgent);
clearBtn.addEventListener('click', clearChat);
exportBtn.addEventListener('click', exportChat);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = '46px';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

loadProviders();
inputEl.focus();
</script>
</body>
</html>
